<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Нет подключения · Строительный объект</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.25rem;
        place-items: center;
      }
      main {
        width: min(100%, 36rem);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.1;
      }
      p {
        margin: 1rem 0 0;
        color: #475569;
        font-size: 1.05rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет подключения</h1>
      <p>
        Проверьте интернет-соединение и обновите страницу. Изменение рабочих
        данных без подтверждения сервера недоступно.
      </p>
    </main>
  </body>
</html>
